[package]
name = "wits-tools"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "wits-tools"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wits_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
tempfile = "3"
# Send API Tester requests through Rust with operating system certificate verification.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "socks", "stream"] }

# Use the same crawl and transfer code from the desktop and console entry points.
crawlee = { git = "https://github.com/apify/crawlee-rs", rev = "ac820f293838353348a30c7be2b072d8a70e2e19" }
anyhow = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
aes = "0.9"
cbc = "0.2"
regex = "1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hickory-proto = { version = "0.25", default-features = false, features = ["std"] }
jsonc-parser = "0.34.0"
serde_path_to_error = "0.1.20"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
